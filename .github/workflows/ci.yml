name: CI (sk8authservice)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sk8authservice
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: sk8authservice/package-lock.json
      - run: npm ci
      - run: npm run lint --if-present
      - name: Run tests with coverage
        run: npm run test:ci
        env:
          NODE_ENV: test
          PORT: '3000'
          API_PREFIX: /api/v1
          JWT_SECRET: test-secret
          JWT_REFRESH_SECRET: test-refresh-secret
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_KEY: test-key
          SUPABASE_JWT_SECRET: test-supabase-jwt
          CORS_ORIGIN: http://localhost:3000
      - run: npm run build
      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-authservice
          path: sk8authservice/coverage

  docker:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          echo "Building Docker image"
          docker build -t sk8/authservice:ci ./sk8authservice